<div class="min-h-screen bg-slate-50 flex flex-col justify-center sm:py-12">
  <div class="p-10 xs:p-0 mx-auto md:w-full md:max-w-md">
    
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-100 mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8 text-indigo-600">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
        </svg>
      </div>
      <h1 class="font-bold text-3xl text-slate-800 tracking-tight">LogPath</h1>
      <p class="text-slate-500 mt-2 text-sm">Sistema central de auditoría y monitoreo</p>
    </div>
    
    <div class="bg-white shadow-xl shadow-slate-200/60 w-full rounded-2xl border border-slate-100 overflow-hidden">
      <div class="px-8 py-8">
        
<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div class="mb-5">
            <label class="font-semibold text-sm text-slate-600 pb-1 block">Correo Electrónico</label>
            <input type="email" formControlName="email" class="border border-slate-300 rounded-lg px-4 py-2.5 mt-1 text-sm w-full focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none transition-all" placeholder="admin@logpath.com" />
          </div>
          
          <div class="mb-6">
            <div class="flex justify-between items-center pb-1">
              <label class="font-semibold text-sm text-slate-600 block">Contraseña</label>
              <a href="#" class="text-xs text-indigo-600 hover:text-indigo-500 font-medium transition">¿Olvidaste tu contraseña?</a>
            </div>
            <input type="password" formControlName="password" class="border border-slate-300 rounded-lg px-4 py-2.5 mt-1 text-sm w-full focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none transition-all" placeholder="••••••••" />
          </div>
          
          <button type="submit" [disabled]="isSubmitting" 
                  class="transition-all duration-200 bg-indigo-600 hover:bg-indigo-700 focus:bg-indigo-800 focus:ring-4 focus:ring-indigo-200 text-white w-full py-2.5 rounded-lg text-sm shadow-md font-semibold text-center flex justify-center items-center disabled:opacity-75 disabled:cursor-not-allowed">
            
            <span *ngIf="!isSubmitting" class="flex items-center">
              Iniciar Sesión
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-4 h-4 ml-2">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
              </svg>
            </span>

            <span *ngIf="isSubmitting" class="flex items-center">
              <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Autenticando de forma segura...
            </span>

          </button>
        </form>

      </div>
    </div>
    
  </div>
</div>
